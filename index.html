<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lane Dodge</title>
    <meta
      name="description"
      content="A tiny lane-dodging driving game: steer left and right to survive the oncoming traffic."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <div id="game-root">
        <canvas id="game-canvas" width="390" height="844" aria-hidden="true"></canvas>

        <section id="start-screen" class="overlay">
          <h1>Lane Dodge</h1>
          <button id="play-button" type="button" class="primary-button">Play</button>
        </section>

        <div id="hud" class="hud" hidden>
          <span id="score" class="score">0</span>
          <div class="controls">
            <button id="left-button" type="button" class="arrow-button" aria-label="Move left">&#9664;</button>
            <button id="right-button" type="button" class="arrow-button" aria-label="Move right">&#9654;</button>
          </div>
        </div>

        <section id="gameover-screen" class="overlay" hidden>
          <p class="final-score">Score: <span id="final-score">0</span></p>
          <button id="restart-button" type="button" class="primary-button">Restart</button>
        </section>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
